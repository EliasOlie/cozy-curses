[package]
name = "pixelwind"
version = "0.1.0"
edition = "2024"
description = "Tailwind para pixel art: assets declarativos (JSON) + tema (TOML) -> PNG pixel-perfect"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
