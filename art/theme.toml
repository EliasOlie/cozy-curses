fur_white_shade = "#d8ccb4"
fur_dark        = "#4a3a35"
fur_tan         = "#d4954e"
fur_tan_light   = "#f2c98e"
fur_tan_dark    = "#9c6230"
beak            = "#f2a23a"
comb            = "#e0483a"
# Tons neutros "tingíveis": o jogo multiplica pela cor escolhida no criador de
# personagem (pele, cabelo, roupa). Iguais nas duas paletas de propósito.
tint_light  = "#ffffff"
tint        = "#d6d6d6"
tint_dark   = "#a3a3a3"
tint_deep   = "#707070"
# Fazenda: madeira avermelhada do celeiro, brilho do feno e da folhagem
barn_dark   = "#73291f"
