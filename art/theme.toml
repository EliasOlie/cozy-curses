# Cozy Curses — Brand Kit de pixel art (lido pelo `pixelwind`)
#
# Regra de ouro: day_palette e night_palette têm EXATAMENTE as mesmas chaves.
# Um asset desenhado uma vez com chaves semânticas ("grass", "crop", "eye"...)
# sai automaticamente nas duas versões: a ilusão do dia e a verdade da noite.
# Cores: "#rrggbb" ou "#rrggbbaa".

[grid]
tile_width = 16    # visão de cima (top-down), como Stardew Valley
tile_height = 16
sprite_size = 32   # personagens: 16x32 (dois tiles de altura)

[border]
enabled = true
color = "outline"  # chave da paleta (cada paleta tem seu próprio contorno)
thickness = 1

# ---------------------------------------------------------------------------
# DIA — A Ilusão Perfeita (Ghibli: pastéis, laranjas quentes, verdes claros)
# ---------------------------------------------------------------------------
[day_palette]
outline     = "#4a3426"
shadow      = "#4a342655"
ink         = "#3b2a20"
grass_dark  = "#6f9e3f"
grass       = "#8cc152"
grass_light = "#b5dd78"
soil_dark   = "#6b4226"
soil        = "#8b5a33"
soil_light  = "#a8733f"
path        = "#e3c48d"
path_light  = "#f0dcae"
water_dark  = "#3a9bc4"
water       = "#5cc6e8"
water_light = "#c4f1fa"
wood_dark   = "#6e4426"
wood        = "#9c6638"
wood_light  = "#c48a52"
roof_dark   = "#7d3f2a"
roof        = "#b0603c"
roof_light  = "#d4825a"
stone_dark  = "#7d776e"
stone       = "#a7a198"
stone_light = "#cfcac0"
leaf_dark   = "#4f8a3a"
leaf        = "#6fb04a"
leaf_light  = "#9fd46a"
crop        = "#f08a24"
crop_light  = "#ffbb66"
crop_leaf   = "#5fae3a"
crop_dark   = "#c2621a"
skin        = "#f2c79a"
skin_shadow = "#d9a273"
shirt       = "#f6eedb"
cloth       = "#4f7cc2"
cloth_dark  = "#34578f"
hat         = "#e6bf62"
hay         = "#e8c25a"
hay_dark    = "#c49a35"
metal       = "#9aa4ad"
window      = "#a8dcf0"
glow        = "#fff1a8"
glow_alt    = "#ffd27a"
eye         = "#3b2a20"
eye_pupil   = "#3b2a20"
flower      = "#f28cb1"
flower_alt  = "#ffe066"
grass_deep  = "#4e7a2c"
leaf_deep   = "#356b2c"
# Vila Serena: telhado de ardósia, reboco, ouro e osso
slate_dark  = "#4a5872"
slate       = "#6a7e9e"
slate_light = "#93a9c6"
plaster     = "#f1e2c2"
plaster_dark = "#d4bc94"
gold        = "#e8b23a"
bone        = "#efe4cc"
# Moradores: tons de roupa (dia) / de monstro (noite)
bone_dark   = "#c9b994"
gold_dark   = "#b07e22"
velvet      = "#8e5a78"
velvet_dark = "#663f58"
swamp       = "#8a9a5b"
swamp_light = "#b3c27a"
swamp_dark  = "#5f6e3a"
# Interiores: papel de parede
wallpaper_dark  = "#7f9c7a"
wallpaper       = "#a3bf98"
wallpaper_light = "#c2d8b0"
# Interface: essência (frasco roxo brilhante)
essence_dark  = "#5e3a9e"
essence       = "#9358e0"
essence_light = "#c9a3ff"
# Interface (art/ui): vidro do HUD, madeira em hover, pergaminho rebaixado
